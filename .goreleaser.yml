version: 2
project_name: pgconfig

# The release workflow compiles every target, and the web app the server
# embeds, in parallel jobs. This configuration then imports those binaries.
# A local run compiles with Cargo, and needs `npm run build` in web/ first.
builds:
  - id: pgconfigctl-linux
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    binary: pgconfigctl
    flags: [--release, --locked, --package=pgconfigctl]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    # musl links statically, like the Go binaries these replace: the binary
    # runs in a scratch image and on any distribution.
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
  - id: pgconfigctl-macos
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    command: build
    binary: pgconfigctl
    flags: [--release, --locked, --package=pgconfigctl]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
  - id: pgconfigctl-windows
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    command: build
    binary: pgconfigctl
    flags: [--release, --locked, --package=pgconfigctl]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    targets:
      - x86_64-pc-windows-msvc

  - id: pgconfig-server-linux
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    binary: pgconfig-server
    flags: [--release, --locked, --package=pgconfig-server]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
  - id: pgconfig-server-macos
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    command: build
    binary: pgconfig-server
    flags: [--release, --locked, --package=pgconfig-server]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
  - id: pgconfig-server-windows
    builder: rust
    tool: '{{ if index .Env "PGCONFIG_PREBUILT_DIR" }}./scripts/release-cargo.sh{{ else }}cargo{{ end }}'
    command: build
    binary: pgconfig-server
    flags: [--release, --locked, --package=pgconfig-server]
    env:
      - PGCONFIG_COMMIT={{ .FullCommit }}
    targets:
      - x86_64-pc-windows-msvc

# The package and archive names are the ones the Go releases used, so a
# script that downloads a release keeps working.
nfpms:
  - id: default
    package_name: pgconfigctl
    file_name_template: >-
      {{ .Binary }}-
      {{ .Version }}-
      {{- if eq .Os "darwin" }}MacOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}-
      {{ .Arch }}

    homepage: https://pgconfig.org/
    maintainer: Sebastian Webber <sebastian@pgconfig.org>
    description: CLI for the pgconfig.org website

    license: MIT

    formats:
      - deb
      - rpm

archives:
  - id: pgconfigctl
    name_template: >-
      {{ .Binary }}-
      {{ .Version }}-
      {{- if eq .Os "darwin" }}MacOS
      {{- else if eq .Os "linux" }}Linux
      {{- else if eq .Os "windows" }}Windows
      {{- else }}{{ .Os }}{{ end }}-
      {{ .Arch }}
    formats:
      - tar.gz
      - binary

checksum:
  name_template: "checksums.txt"

release:
  footer: >-
    ## Docker Images

    - `docker pull ghcr.io/momoi-labs/pgconfig:v{{ .Version }}`
    - `docker pull ghcr.io/momoi-labs/pgconfigctl:v{{ .Version }}`

    The images `pgconfig/api` and `pgconfig/pgconfigctl`, on Docker Hub and on
    `ghcr.io/pgconfig`, stopped at 3.6.1. `ghcr.io/momoi-labs/pgconfig`
    replaces `pgconfig/api`: its binary is `pgconfig-server`, and it needs no
    `rules.yml` or `pg-docs.yml` next to it.

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: "^.*(feat|chore)[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

dockers_v2:
  - id: pgconfigctl
    ids:
      - pgconfigctl-linux
    dockerfile: crates/pgconfigctl/Dockerfile
    images:
      - "ghcr.io/momoi-labs/pgconfigctl"
    tags:
      - "v{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
      - "latest"
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "pgconfigctl"
      "org.opencontainers.image.source": "https://github.com/momoi-labs/pgconfig"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--provenance=false"
    sbom: false

  - id: pgconfig
    ids:
      - pgconfig-server-linux
    dockerfile: crates/pgconfig-server/Dockerfile
    images:
      - "ghcr.io/momoi-labs/pgconfig"
    tags:
      - "v{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
      - "latest"
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "pgconfig"
      "org.opencontainers.image.source": "https://github.com/momoi-labs/pgconfig"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - "--provenance=false"
    sbom: false
