name: Version

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: changesets-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version:packages
          title: "chore: release pgconfig-api"
          commit: "chore: release pgconfig-api"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Bot-created PRs do not trigger pull_request workflows with this token.
      - name: Run CI on the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cover.yml --ref changeset-release/main

      # The action's publish detection expects CLI v2 output. Keep tagging
      # explicit so CLI v3 output and GitHub release creation are independent.
      # Releases before Changesets used bare tags, such as 3.6.1.
      - name: Tag the merged version
        id: tag
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          node scripts/release-version.mjs check
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag" ||
            git show-ref --verify --quiet "refs/tags/$version"; then
            echo "Version $version is already tagged; use the Release workflow to retry it."
            exit 0
          fi
          npm run release:tag
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN do not trigger the tag-push workflow.
  release:
    needs: version
    if: needs.version.outputs.tag != ''
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
