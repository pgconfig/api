name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run test:release
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: check

  # cargo test replays the goldens in tests/golden against the server and the
  # CLI, so this job is also the compatibility check of REST v1.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The web app ships inside the server, so it is built before cargo is.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: web
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast

  # The release builds for macOS and Windows, and the Linux job above never
  # compiles or links their platform code. Building both binaries and running
  # the CLI on its detected defaults catches what would break there.
  platforms:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --locked -p pgconfigctl -p pgconfig-server
      - run: cargo run --locked -p pgconfigctl -- tune
