name: release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  # Each target compiles on a runner of its own platform. The publishing job
  # then packages the binaries without compiling anything.
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            command: zigbuild
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            command: zigbuild
          - os: macos-latest
            target: x86_64-apple-darwin
            command: build
          - os: macos-latest
            target: aarch64-apple-darwin
            command: build
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            command: build
            exe: .exe
    defaults:
      run:
        shell: bash
    steps:
      # A Windows runner checks files out with CRLF. The version check reads
      # Cargo.toml line by line, and the binaries embed text files, so every
      # runner keeps the line endings the repository has.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check release version
        run: node scripts/release-version.mjs check "${VERSION#v}"

      # The web app ships inside the server, so it is built before cargo is.
      - run: npm ci && npm run build
        working-directory: web

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-key: release-${{ matrix.target }}

      - uses: mlugg/setup-zig@v1
        if: runner.os == 'Linux'
        with:
          version: 0.13.0

      - run: cargo install --locked cargo-zigbuild
        if: runner.os == 'Linux'

      # The binaries report the commit they were built from.
      - run: echo "PGCONFIG_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - run: >-
          cargo ${{ matrix.command }} --release --locked
          --target ${{ matrix.target }}
          --package pgconfigctl --package pgconfig-server

      # Tar preserves the executable mode when transferring between runners.
      - run: >-
          tar czf ${{ matrix.target }}.tar.gz
          -C target/${{ matrix.target }}/release
          pgconfigctl${{ matrix.exe }} pgconfig-server${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.target }}.tar.gz
          compression-level: 0
          retention-days: 1

  goreleaser:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate manually selected tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RELEASE_TAG" =~ $pattern ]]; then
            echo "Tag must be a semantic version with a v prefix."
            exit 1
          fi

          if [[ "$(git tag --points-at HEAD --list "$RELEASE_TAG")" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not point to the checked-out commit."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: prebuilt
          merge-multiple: true

      - name: Unpack release binaries
        run: |
          for archive in prebuilt/*.tar.gz; do
            target=$(basename "$archive" .tar.gz)
            mkdir -p "prebuilt/$target"
            tar xzf "$archive" -C "prebuilt/$target"
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check release version
        run: node scripts/release-version.mjs check "${VERSION#v}"

      - name: Prepare release notes
        run: node scripts/release-version.mjs notes > release-notes.md

      # GoReleaser's Rust builder still prepares target metadata. The tool hook
      # imports the matrix artifacts, so this job needs no Zig or compilation.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PGCONFIG_PREBUILT_DIR: ${{ github.workspace }}/prebuilt
