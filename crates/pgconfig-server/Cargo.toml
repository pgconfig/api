[package]
name = "pgconfig-server"
description = "The pgconfig HTTP server: REST v1"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
pgconfig = { path = "../pgconfig" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["catch-panic", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = "6"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

[dev-dependencies]
http-body-util = "0.1"
pgconfig-golden = { path = "../golden" }
tower = { version = "0.5", features = ["util"] }
